backend:
  name: github
  repo: sungminlee417/Collin-Luke-Website # Replace with your GitHub username/repo
  branch: main

# Uncomment to enable local development mode
# local_backend: true

# Enable draft mode for better content management
publish_mode: editorial_workflow

media_folder: public/images # Media files will be stored in the repo under public/images
public_folder: /images # The src attribute for uploaded media will begin with /images

collections:
  # Hero Section
  - name: "hero"
    label: "Hero Section"
    files:
      - label: "Hero Content"
        name: "hero"
        file: "content/hero/hero.md"
        fields:
          - {
              label: "Logo Image",
              name: "logo",
              widget: "image",
              hint: "The main logo displayed on the hero section",
            }
          - {
              label: "Logo Alt Text",
              name: "logoAlt",
              widget: "string",
              default: "The Muse Duo Logo",
              hint: "Alt text for the logo image",
            }
          - {
              label: "Background Image",
              name: "backgroundImage",
              widget: "image",
              hint: "The background image for the hero section",
            }
          - {
              label: "Background Image Alt Text",
              name: "backgroundAlt",
              widget: "string",
              default: "The Muse Duo Background",
              hint: "Alt text for the background image",
            }
          - {
              label: "Call to Action Text",
              name: "ctaText",
              widget: "string",
              default: "Explore",
              hint: "Text for the scroll button",
            }
          - {
              label: "Show Call to Action Button",
              name: "showCta",
              widget: "boolean",
              default: true,
              hint: "Toggle to show/hide the explore button",
            }
          - {
              label: "Logo Width (Desktop)",
              name: "logoWidth",
              widget: "number",
              default: 400,
              hint: "Logo width in pixels on desktop",
            }
          - {
              label: "Logo Height (Desktop)",
              name: "logoHeight",
              widget: "number",
              default: 200,
              hint: "Logo height in pixels on desktop",
            }
          - {
              label: "Content Alignment",
              name: "contentAlignment",
              widget: "select",
              options: ["left", "center"],
              default: "left",
              hint: "Keep 'left' to avoid covering Luke's face in the background image",
            }
          - {
              label: "Overlay Opacity",
              name: "overlayOpacity",
              widget: "select",
              options: ["light", "medium", "dark"],
              default: "medium",
              hint: "Darkness of the background overlay",
            }

  # About Section
  - name: "about"
    label: "About Section"
    files:
      - label: "About Content"
        name: "about"
        file: "content/about/about.md"
        fields:
          - {
              label: "Title",
              name: "title",
              widget: "string",
              default: "About",
            }
          - {
              label: "Subtitle",
              name: "subtitle",
              widget: "string",
              default: "The Muse Duo is a guitar and piano ensemble formed at the Eastman School of Music",
            }
          - { label: "Main Content", name: "body", widget: "markdown" }
          - { label: "Profile Image", name: "profileImage", widget: "image" }
          - {
              label: "Profile Image Alt Text",
              name: "profileImageAlt",
              widget: "string",
              default: "The Muse Duo professional portrait",
            }
          - {
              label: "Featured Artists",
              name: "artists",
              widget: "list",
              fields:
                [
                  { label: "Name", name: "name", widget: "string" },
                  { label: "Instrument", name: "instrument", widget: "string" },
                ],
            }

  # Concerts Section
  - name: "concerts"
    label: "Concerts"
    folder: "content/concerts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "venue"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date & Time", name: "date", widget: "datetime" }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "City, State", name: "location", widget: "string" }
      - {
          label: "Ticket URL",
          name: "ticketUrl",
          widget: "string",
          required: false,
        }
      - { label: "Description", name: "body", widget: "text", required: false }
      - {
          label: "Status",
          name: "status",
          widget: "select",
          options: ["upcoming", "past"],
          default: "upcoming",
        }

  # Music/Recordings Section
  - name: "recordings"
    label: "Music & Recordings"
    folder: "content/recordings"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["order", "title", "dateRecorded"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Composer",
          name: "composer",
          widget: "string",
          required: false,
        }
      - { label: "YouTube URL", name: "url", widget: "string" }
      - {
          label: "Spotify URL",
          name: "spotifyUrl",
          widget: "string",
          required: false,
        }
      - {
          label: "Apple Music URL",
          name: "appleMusicUrl",
          widget: "string",
          required: false,
        }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: false,
        }
      - {
          label: "Date Recorded",
          name: "dateRecorded",
          widget: "datetime",
          required: false,
        }
      - {
          label: "Duration",
          name: "duration",
          widget: "string",
          required: false,
        }
      - {
          label: "Thumbnail",
          name: "thumbnail",
          widget: "image",
          required: false,
        }
      - { label: "Order", name: "order", widget: "number", default: 0 }
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default: false,
        }
      - { label: "Album", name: "album", widget: "string", required: false }

  # Gallery Section
  - name: "gallery"
    label: "Photo Gallery"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["order", "dateTaken"]
    fields:
      - { label: "Image URL", name: "url", widget: "image" }
      - {
          label: "Alt Text",
          name: "alt",
          widget: "string",
          default: "Gallery image",
        }
      - { label: "Caption", name: "caption", widget: "text", required: false }
      - { label: "Order", name: "order", widget: "number", default: 0 }

  # Press Section
  - name: "press"
    label: "Press & Reviews"
    folder: "content/press"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["date", "order"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Date", name: "date", widget: "string" }
      - { label: "Article Link", name: "link", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Order", name: "order", widget: "number", default: 0 }

  # Contact Section
  - name: "contact"
    label: "Contact Section"
    files:
      - label: "Contact Information"
        name: "contact"
        file: "content/contact/contact.md"
        fields:
          - {
              label: "Title",
              name: "title",
              widget: "string",
              default: "Contact",
            }
          - {
              label: "Subtitle",
              name: "subtitle",
              widget: "string",
              required: false,
            }
          - {
              label: "Description",
              name: "body",
              widget: "markdown",
              required: false,
            }
          - { label: "Primary Email", name: "email", widget: "string" }
          - {
              label: "Booking Email",
              name: "bookingEmail",
              widget: "string",
              required: false,
            }
          - { label: "Phone", name: "phone", widget: "string", required: false }
          - {
              label: "Management Contact",
              name: "management",
              widget: "object",
              required: false,
              fields:
                [
                  { label: "Name", name: "name", widget: "string" },
                  { label: "Email", name: "email", widget: "string" },
                  {
                    label: "Phone",
                    name: "phone",
                    widget: "string",
                    required: false,
                  },
                ],
            }
          - {
              label: "Social Media",
              name: "social",
              widget: "object",
              fields:
                [
                  {
                    label: "Instagram",
                    name: "instagram",
                    widget: "string",
                    required: false,
                  },
                  {
                    label: "YouTube",
                    name: "youtube",
                    widget: "string",
                    required: false,
                  },
                  {
                    label: "Facebook",
                    name: "facebook",
                    widget: "string",
                    required: false,
                  },
                  {
                    label: "Spotify",
                    name: "spotify",
                    widget: "string",
                    required: false,
                  },
                  {
                    label: "Apple Music",
                    name: "appleMusic",
                    widget: "string",
                    required: false,
                  },
                ],
            }
          - {
              label: "Contact Image",
              name: "contactImage",
              widget: "image",
              required: false,
            }

  # Site Settings
  - name: "settings"
    label: "General Settings"
    files:
      - label: "Site Information"
        name: "site"
        file: "content/settings/site.md"
        fields:
          - {
              label: "Site Title",
              name: "title",
              widget: "string",
              default: "The Muse Duo",
            }
          - {
              label: "Site Description",
              name: "description",
              widget: "text",
              default: "Classical guitar and piano duo",
            }
          - {
              label: "Site URL",
              name: "url",
              widget: "string",
              required: false,
            }
          - {
              label: "Default SEO Image",
              name: "seoImage",
              widget: "image",
              required: false,
            }
          - {
              label: "Favicon",
              name: "favicon",
              widget: "image",
              required: false,
            }

      - label: "Navigation"
        name: "navigation"
        file: "content/settings/navigation.md"
        fields:
          - {
              label: "Menu Items",
              name: "menuItems",
              widget: "list",
              fields:
                [
                  { label: "Label", name: "label", widget: "string" },
                  { label: "Section", name: "section", widget: "string" },
                  {
                    label: "Order",
                    name: "order",
                    widget: "number",
                    default: 0,
                  },
                ],
            }
          - {
              label: "Show Logo in Navigation",
              name: "showLogo",
              widget: "boolean",
              default: false,
            }

      - label: "Footer"
        name: "footer"
        file: "content/settings/footer.md"
        fields:
          - {
              label: "Title",
              name: "title",
              widget: "string",
              default: "The Muse Duo",
            }
          - {
              label: "Tagline",
              name: "tagline",
              widget: "string",
              default: "Classical music reimagined for modern audiences",
            }
          - {
              label: "Logo",
              name: "logo",
              widget: "image",
              default: "/images/icon.png",
            }
          - {
              label: "Social Links",
              name: "socialLinks",
              widget: "list",
              fields:
                [
                  { label: "Platform Name", name: "name", widget: "string" },
                  { label: "URL", name: "href", widget: "string" },
                  {
                    label: "Order",
                    name: "order",
                    widget: "number",
                    default: 0,
                  },
                ],
            }
